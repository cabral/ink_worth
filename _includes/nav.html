{% comment %}
  Nav order follows the home page: 01 Morning Pages, 02 Events, 03 ION Heart.
  The masthead is the link home.
{% endcomment %}
{% assign url = page.url %}
<header class="running-head">
  <a class="masthead" href="{{ '/' | relative_url }}"{% if url == '/' %} aria-current="page"{% endif %}>{% include mark.html %}INK worth</a>
  <nav class="site-nav" aria-label="Main">
    <a href="{{ '/morning-pages/' | relative_url }}"{% if url contains '/morning-pages' %} aria-current="page"{% endif %}>Morning Pages</a>
    <a href="{{ '/events/' | relative_url }}"{% if url contains '/events' %} aria-current="page"{% endif %}>Events</a>
    <a href="{{ '/solo_ionheart/' | relative_url }}"{% if url contains '/solo_ionheart' %} aria-current="page"{% endif %}>ION Heart</a>
  </nav>
</header>
